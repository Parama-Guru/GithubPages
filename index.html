<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parama Guru</title>
    <meta name="description" content="Projects and presentations by Parama Guru." />
    <link rel="icon" type="image/png" href="originzero/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: rgb(249, 248, 245);
        --ink: rgb(26, 22, 19);
        --muted: rgb(102, 102, 102);
        --sand: rgba(227, 221, 207, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .eyebrow {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 18px;
      }
      h1 {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 300;
        line-height: 0.98;
        letter-spacing: -0.02em;
        font-size: clamp(38px, 7vw, 62px);
        margin: 0 0 14px;
      }
      h1 em {
        font-style: italic;
      }
      .lead {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
        margin: 0 0 40px;
        max-width: 46ch;
      }
      a.card {
        display: block;
        padding: 22px 24px;
        border: 1px solid var(--sand);
        border-radius: 16px;
        background: #fff;
        text-decoration: none;
        color: inherit;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s;
      }
      a.card:hover {
        transform: translateY(-2px);
        border-color: rgba(26, 22, 19, 0.22);
      }
      a.card h2 {
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 300;
        font-size: 26px;
        margin: 0 0 6px;
      }
      a.card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }
      footer {
        margin-top: 40px;
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        a.card {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <p class="eyebrow">Parama Guru</p>
      <h1>Things I have<br /><em>been building.</em></h1>
      <p class="lead">
        Applied Mathematics &amp; Computational Science, PSG College of Technology.
      </p>

      <a class="card" href="originzero/">
        <h2>OriginZero — approval deck</h2>
        <p>
          A research collaboration portal for the AMCS department. Seven slides, presented as a
          website.
        </p>
      </a>

      <footer>github.com/Parama-Guru</footer>
    </main>
  </body>
</html>
